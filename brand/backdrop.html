<!doctype html>
<html><head><meta charset="utf-8"><style>
 html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B0A12}
 .bg{position:absolute;inset:0;background:
   radial-gradient(70% 80% at 22% 18%, #2C1D50 0%, rgba(27,19,48,0.55) 42%, rgba(11,10,18,0) 78%),
   radial-gradient(60% 60% at 82% 86%, rgba(233,182,90,0.16) 0%, rgba(11,10,18,0) 70%),
   linear-gradient(160deg,#0B0A12 0%, #150F26 55%, #0B0A12 100%)}
 .rings{position:absolute;inset:0;opacity:0.16}
 .ghost{position:absolute;left:56%;top:50%;transform:translate(-50%,-50%);opacity:0.07}
 .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(201,194,219,0.10) 1px, transparent 1px);
        background-size:26px 26px;opacity:0.25}
</style></head><body>
 <div class="bg"></div>
 <div class="grain"></div>
 <svg class="rings" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
   <circle cx="1180" cy="540" r="240" stroke="#E9B65A" stroke-width="1.5"/>
   <circle cx="1180" cy="540" r="380" stroke="#C9C2DB" stroke-width="1"/>
   <circle cx="1180" cy="540" r="520" stroke="#C9C2DB" stroke-width="1"/>
 </svg>
 <svg class="ghost" width="760" height="760" viewBox="0 0 512 512" fill="none">
   <path d="M256 56 L392 256 L256 456 L120 256 Z" stroke="#E9B65A" stroke-width="10" stroke-linejoin="round"/>
   <circle cx="256" cy="256" r="34" fill="#E9B65A"/>
 </svg>
</body></html>
